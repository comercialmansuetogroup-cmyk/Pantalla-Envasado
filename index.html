<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactoryFlow Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Scrollbar for dark/elegant look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Animation Utilities */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out forwards;
    }
    
    /* 3xl Breakpoint for 4K screens */
    @media (min-width: 2000px) {
      .3xl\:grid-cols-5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }
  </style>
  <script>
    // Sistema de diagnóstico de emergencia
    window.onerror = function(msg, url, line, col, error) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#b91c1c;color:white;padding:20px;z-index:99999;font-family:monospace;font-size:12px;';
      errorDiv.innerHTML = '<strong>ERROR DE CARGA:</strong> ' + msg + '<br><small>' + url + ' L:' + line + '</small>';
      document.body.appendChild(errorDiv);
      return false;
    };
  </script>
