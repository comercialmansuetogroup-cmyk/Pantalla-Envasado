
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FactorySync | Sistema de Producción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      overflow: hidden; 
      height: 100vh;
      width: 100vw;
      margin: 0;
      background-color: #080a0f;
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }

    /* ESTILOS DE IMPRESIÓN PARA PDF */
    @media print {
      @page { margin: 1cm; size: landscape; }
      body { 
        background-color: white !important; 
        color: black !important; 
        overflow: visible !important; 
        height: auto !important; 
        width: 100% !important;
      }
      header, nav, .no-print, button, ::-webkit-scrollbar { 
        display: none !important; 
      }
      /* Forzar colores de fondo para gráficas */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      
      /* Ajustes específicos para el dashboard al imprimir */
      main { overflow: visible !important; position: static !important; }
    }
  </style>
<script type="importmap">

  }
}
</script>
</head>

</body>
</html>
