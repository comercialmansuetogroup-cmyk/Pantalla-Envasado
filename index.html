<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactoryFlow Dashboard v3</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }
    body { margin: 0; background-color: #020617; color: white; overflow-x: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.408.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  
  <script 
    type="text/babel" 
    data-type="module" 
    data-presets="react,typescript" 
    src="./index.tsx">
  </script>

  <script>
    window.onerror = function(msg, url, line, col, error) {
      if (msg.includes('Script error')) return;
      console.error("Critical Dashboard Error:", msg);
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#ef4444;color:white;padding:20px;border-radius:15px;z-index:9999;font-size:12px;max-width:350px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);';
      errorDiv.innerHTML = '<b style="display:block;margin-bottom:5px;font-size:14px;">⚠️ Error de Ejecución</b>' + msg + '<br><br><small style="opacity:0.8">Tip: El servidor está enviando HTML en lugar de JS. Revisa el log de Railway.</small>';
      document.body.appendChild(errorDiv);
      return false;
    };
  </script>
</body>
</html>
