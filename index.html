
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FactorySync | Sistema de Producción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    :root {
      --bg-main: #111319;
      --bg-card: #1a1d26;
      --accent: #dc2626;
      --text-dim: rgba(255,255,255,0.4);
    }

    * { box-sizing: border-box; border-radius: 0 !important; cursor: default; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-main); 
      color: white; 
      overflow: hidden; 
      height: 100vh;
      width: 100vw;
    }

    .custom-scroll::-webkit-scrollbar { width: 2px; height: 2px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: var(--accent); }

    /* Estructura de Columnas */
    .client-section {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      min-width: 400px;
    }

    .sub-columns-container {
      display: flex;
      flex: 1;
      overflow-x: auto;
    }

    .product-list-column {
      flex: 1;
      min-width: 380px;
      border-right: 1px solid rgba(255,255,255,0.03);
    }

    /* Filas de Producto Estilo Original */
    .p-row {
      display: grid;
      grid-template-columns: 1fr 60px 60px 60px;
      padding: 6px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      align-items: center;
      font-size: 13px;
    }

    .p-row:hover { background: rgba(255,255,255,0.02); }

    .p-header {
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 900;
      color: var(--text-dim);
      padding: 4px 15px;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .trend-badge {
      font-size: 8px;
      font-weight: 900;
      padding: 1px 4px;
      margin-left: 6px;
    }

    /* Animación de Actualización */
    .flash-update {
      animation: flash-row 2.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes flash-row {
      0% { background-color: rgba(220, 38, 38, 0.4); }
      100% { background-color: transparent; }
    }

    #modal-config { background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="flex flex-col">

  <!-- TOP NAV -->
  <nav class="h-16 flex-none bg-[#0a0c10] border-b border-white/5 flex items-center justify-between px-6">
    <div class="flex items-center gap-4">
      <img id="logo-img" src="" class="h-8 hidden">
      <div id="logo-placeholder" class="font-black text-lg tracking-tighter">AN<span class="text-red-600">SUETO</span></div>
      <span class="text-[8px] font-black opacity-20 uppercase tracking-[0.3em] mt-1">Industrial Dashboard V13</span>
    </div>

    <div class="flex items-center gap-10">
      <div class="flex bg-white/5 p-1">
        <button onclick="setView('live')" id="btn-live" class="px-5 py-1.5 bg-red-600 text-[10px] font-black uppercase flex items-center gap-2">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> PEDIDOS
        </button>
        <button onclick="setView('stats')" id="btn-stats" class="px-5 py-1.5 text-[10px] font-black uppercase opacity-40 hover:opacity-100 flex items-center gap-2">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg> ANALÍTICA
        </button>
      </div>

      <div class="flex flex-col items-end">
        <p class="text-[8px] font-black opacity-30 uppercase tracking-widest">Producción Global</p>
        <p id="total-global" class="text-2xl font-black text-red-600 tabular-nums leading-none">0</p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleModal(true)" class="p-2 border border-white/10 hover:bg-white/5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <main id="container-main" class="flex-1 flex overflow-x-auto custom-scroll">
    <!-- Las secciones de clientes se inyectan aquí -->
  </main>

  <!-- CONFIG MODAL -->
  <div id="modal-config" class="fixed inset-0 z-[200] hidden flex items-center justify-end">
    <div class="bg-[#1a1d26] w-[450px] h-full shadow-2xl border-l border-white/10 flex flex-col p-8 space-y-10 animate-slide-in">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-black uppercase italic tracking-tighter">System Configuration</h2>
        <button onclick="toggleModal(false)" class="text-2xl font-bold opacity-30 hover:opacity-100">&times;</button>
      </div>

      <!-- Settings -->
      <div class="space-y-8 flex-1 overflow-y-auto pr-4 custom-scroll">
        <div class="space-y-4">
          <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">Logotipos (Base64)</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="document.getElementById('file-logo').click()" class="p-4 bg-white/5 text-[10px] font-bold border border-white/5 hover:bg-white/10">SUBIR LOGO</button>
            <button onclick="resetLogo()" class="p-4 bg-red-600/20 text-[10px] font-bold text-red-500 border border-red-500/20">BORRAR</button>
          </div>
          <input type="file" id="file-logo" class="hidden" onchange="uploadLogo(this)">
        </div>

        <div class="space-y-4">
          <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">Densidad de Datos</label>
          <div class="flex justify-between text-[10px] font-bold"><span>FILAS POR COLUMNA</span> <span id="val-rows" class="text-red-500">20</span></div>
          <input type="range" min="5" max="50" value="20" class="w-full accent-red-600" oninput="updateSetting('maxRows', this.value)">
        </div>

        <div class="space-y-4 pt-4 border-t border-white/5">
          <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">Tipografías (PX)</label>
          <div class="space-y-4">
            <div class="flex justify-between text-[10px] font-bold"><span>TAMAÑO CLIENTE</span> <input type="number" value="24" class="bg-black/40 w-12 text-center" onchange="updateSetting('fsClient', this.value)"></div>
            <div class="flex justify-between text-[10px] font-bold"><span>TAMAÑO PRODUCTO</span> <input type="number" value="13" class="bg-black/40 w-12 text-center" onchange="updateSetting('fsProduct', this.value)"></div>
            <div class="flex justify-between text-[10px] font-bold"><span>TAMAÑO CÓDIGO</span> <input type="number" value="14" class="bg-black/40 w-12 text-center" onchange="updateSetting('fsCode', this.value)"></div>
          </div>
        </div>

        <div class="pt-10 space-y-2">
           <button onclick="resetData()" class="w-full py-4 bg-red-600/10 text-red-500 border border-red-500/20 text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition-all">Limpiar Histórico del Día</button>
        </div>
      </div>

      <button onclick="toggleModal(false)" class="w-full py-5 bg-white text-black text-xs font-black uppercase tracking-widest">Aplicar y Cerrar</button>
    </div>
  </div>

  <script>
    let currentData = [];
    let prevData = [];
    let settings = JSON.parse(localStorage.getItem('fs_settings_v13')) || {
      maxRows: 22,
      fsClient: 24,
      fsProduct: 11,
      fsCode: 13,
      logo: ''
    };

    function toggleModal(show) { document.getElementById('modal-config').classList.toggle('hidden', !show); }

    function updateSetting(key, val) {
      settings[key] = parseInt(val) || val;
      if(key === 'maxRows') document.getElementById('val-rows').innerText = val;
      localStorage.setItem('fs_settings_v13', JSON.stringify(settings));
      render();
    }

    function uploadLogo(input) {
      const reader = new FileReader();
      reader.onload = e => { settings.logo = e.target.result; applyLogo(); updateSetting('logo', settings.logo); };
      reader.readAsDataURL(input.files[0]);
    }

    function applyLogo() {
      const img = document.getElementById('logo-img');
      const place = document.getElementById('logo-placeholder');
      if(settings.logo) { img.src = settings.logo; img.classList.remove('hidden'); place.classList.add('hidden'); }
    }

    async function fetchData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        prevData = JSON.parse(JSON.stringify(currentData));
        currentData = data;
        render();
      } catch (e) { console.error(e); }
    }

    function render() {
      const container = document.getElementById('container-main');
      if (!currentData || currentData.length === 0) {
        container.innerHTML = `<div class="w-full flex items-center justify-center opacity-10 text-4xl font-black italic tracking-[1em]">NO DATA ACTIVE</div>`;
        return;
      }

      const mapping = { '24': 'FILIPPO', '26': 'PINGÜINO', '23': 'LA PALMA', '15': 'TENERIFE NORTE', '10': 'GRAN CANARIA', '14': 'GRAN CANARIA', '5': 'GRAN CANARIA', '0': 'GRAN CANARIA' };
      const groups = {};
      let gSum = 0;

      currentData.forEach(row => {
        const cName = mapping[row.agent_code] || row.agent_name || `ZONA ${row.agent_code}`;
        if (!groups[cName]) groups[cName] = { name: cName, items: [] };
        groups[cName].items.push(row);
        gSum += Number(row.total_qty);
      });

      document.getElementById('total-global').innerText = gSum.toLocaleString();

      container.innerHTML = Object.values(groups)
        .sort((a,b) => a.name === 'GRAN CANARIA' ? -1 : a.name.localeCompare(b.name))
        .map(group => {
          const groupTotal = group.items.reduce((acc, i) => acc + Number(i.total_qty), 0);
          
          // Lógica de Sub-columnas
          const columns = [];
          for (let i = 0; i < group.items.length; i += settings.maxRows) {
            columns.push(group.items.slice(i, i + settings.maxRows));
          }

          return `
            <section class="client-section">
              <!-- HEADER CLIENTE -->
              <div class="p-6 border-b border-white/5 bg-black/20">
                <div class="flex items-center gap-3">
                  <h2 class="font-black uppercase tracking-tighter leading-none" style="font-size: ${settings.fsClient}px">${group.name}</h2>
                  <span class="text-[8px] font-black opacity-20 uppercase mt-1">— 0%</span>
                </div>
              </div>

              <!-- CONTENEDOR DE LISTAS -->
              <div class="sub-columns-container">
                ${columns.map(colItems => `
                  <div class="product-list-column">
                    <div class="p-header">
                      <div class="grid grid-cols-[1fr_60px_60px_60px]">
                        <span>REFERENCIA</span>
                        <span class="text-right">STOCK DISP.</span>
                        <span class="text-right">FALTANTE</span>
                        <span class="text-right">PEDIDO</span>
                      </div>
                    </div>
                    ${colItems.map(item => {
                      const lack = Math.max(0, item.total_qty - item.stock);
                      const isDone = lack <= 0;
                      const prevItem = prevData.find(p => p.product_code === item.product_code && p.agent_code === item.agent_code);
                      const isNew = prevItem && Number(prevItem.total_qty) !== Number(item.total_qty);
                      
                      return `
                        <div class="p-row ${isNew ? 'flash-update' : ''} ${isDone ? 'opacity-10 grayscale' : ''}">
                          <div class="flex flex-col min-w-0 pr-4">
                            <div class="flex items-center">
                              <span class="font-black" style="font-size: ${settings.fsCode}px">#${item.product_code}</span>
                              <span class="trend-badge text-slate-500 opacity-30">— 0%</span>
                            </div>
                            <div class="text-[9px] font-bold opacity-30 uppercase truncate" style="font-size: ${settings.fsProduct}px">${item.product_name}</div>
                          </div>
                          <div class="text-right font-bold text-slate-400 tabular-nums">${item.stock}</div>
                          <div class="text-right font-black ${lack > 0 ? 'text-orange-500' : 'text-green-500'} tabular-nums">${lack || '0'}</div>
                          <div class="text-right font-black text-2xl tracking-tighter tabular-nums leading-none mt-1">${item.total_qty}</div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `).join('')}
              </div>

              <!-- FOOTER CLIENTE -->
              <div class="p-6 border-t border-white/5 bg-black/40">
                <div class="flex items-end justify-between">
                  <div>
                    <p class="text-[8px] font-black opacity-30 uppercase">Total Pedidos</p>
                    <p class="text-5xl font-black text-red-600 leading-none mt-1">${groupTotal}</p>
                  </div>
                </div>
              </div>
            </section>
          `;
        }).join('');
    }

    async function resetData() { if(confirm('¿Reiniciar hoy?')) { await fetch('/api/reset', {method:'POST'}); fetchData(); } }
    
    // Engine Init
    applyLogo();
    const es = new EventSource('/api/events');
    es.onmessage = () => fetchData();
    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
