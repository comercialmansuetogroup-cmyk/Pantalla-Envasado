<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactoryFlow 4K - Legibilidad Optimizada</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }
    html, body { 
      background-color: #020617; 
      color: white; 
      overflow: hidden; 
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
    }
    #root { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <script>
    // Captura de errores para depuración
    window.onerror = function(message, source, lineno, colno, error) {
      if (message.includes('invariant=31') || message.includes('Objects are not valid')) {
        console.group('%c🚨 REACT ERROR #31', 'background: #7f1d1d; color: #fff; padding: 10px; font-weight: bold;');
        console.error('Mensaje:', message);
        console.error('Posible causa: Conflicto de versiones de React o importación incorrecta.');
        console.groupEnd();
      }
      return false;
    };
  </script>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script 
    type="text/babel" 
    data-type="module" 
    data-presets="react,typescript" 
    src="./index.tsx">
  </script>
</body>
</html>
