<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactoryFlow 4K - Debug Mode</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }
    html, body { 
      background-color: #020617; 
      color: white; 
      overflow: hidden; 
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
    }
    #root { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <!-- ERROR TRACKER: Captura el error #31 antes de que React lo oculte -->
  <script>
    window.addEventListener('error', function(event) {
      console.group('%c🚨 DETECTOR DE ERRORES CRÍTICOS', 'background: #000; color: #ff0000; font-size: 14px; font-weight: bold; padding: 4px;');
      console.error('MENSAJE:', event.message);
      console.error('ARCHIVO:', event.filename);
      console.error('LINEA:', event.lineno);
      console.error('COLUMNA:', event.colno);
      if (event.error && event.error.stack) {
        console.error('STACK TRACE:', event.error.stack);
      }
      console.log('%cCONSEJO: El error #31 indica que intentas renderizar un objeto {} donde React espera texto o un elemento.', 'color: #ffaa00; font-weight: bold;');
      console.groupEnd();
    });
  </script>

  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.408.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script 
    type="text/babel" 
    data-type="module" 
    data-presets="react,typescript" 
    src="./index.tsx">
  </script>
</body>
</html>
